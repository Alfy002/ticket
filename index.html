<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biglietti Halloween</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1f1e1d;--mut:#73726c;--line:#e6e4dc;--acc:#c62827;--ok:#2f8f5b;--warn:#c98a1b;--bad:#c0463b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2a2927;--ink:#f3f2ee;--mut:#a09f98;--line:#3a3936}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px 18px 24px;max-width:520px;width:100%;margin:0 auto}
h1{font-size:24px;margin:4px 0 4px;font-family:ui-serif,Georgia,serif;font-weight:500}
p.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 6px}
input{width:100%;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px;outline:none}
input:focus{border-color:var(--acc)}
button{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:12px;padding:14px;width:100%;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.wa{background:#25a55a}
button:active{opacity:.8}
.row{display:flex;gap:10px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mut);border-radius:0;font-size:13px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.range{display:flex;gap:10px;align-items:center;margin-bottom:6px}.range input{margin:0;text-align:center}.range span{color:var(--mut);font-size:13px;white-space:nowrap}
.search{position:relative;margin-bottom:10px}.search svg{position:absolute;left:13px;top:14px;width:20px;height:20px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round}.search input{padding-left:44px;margin:0}
nav button.on{color:var(--acc)}
.tab{display:none}.tab.on{display:block}
#prev{width:100%;border-radius:14px;display:none;margin-bottom:12px}
.vid{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1;margin-bottom:12px}
.vid video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px}
.res{border-radius:16px;padding:18px;text-align:center;margin-bottom:12px;color:#fff;display:none}
.res b{display:block;font-size:22px;margin-bottom:4px}
.res.ok{background:var(--ok)}.res.warn{background:var(--warn)}.res.bad{background:var(--bad)}
.big{font-size:56px;font-family:ui-serif,Georgia,serif;text-align:center;margin:4px 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border:0}.li small{color:var(--mut)}
.li button{width:auto;padding:6px 12px;font-size:13px}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}
.sw .bk{position:absolute;inset:0;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-size:13px;font-weight:600}
.sw .li{position:relative;background:var(--card);border:0;touch-action:pan-y;transition:transform .2s}
.sw .li.in{background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.sw .li.drag{transition:none}
.filt{display:flex;gap:10px;margin-bottom:10px}.filt .search{flex:1;margin:0}.filt .search input{height:48px;padding-top:0;padding-bottom:0}.filt .search svg{top:14px}.filt button{width:48px;height:48px;flex:none;padding:0;display:flex;align-items:center;justify-content:center}
.mono{font-family:ui-monospace,Menlo,monospace}

#ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:24px}
#ov.ok{background:#1f9d55}#ov.bad{background:#c62827}
#ov svg{width:56vmin;height:56vmin;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#ov h2{font-size:34px;margin:0}#ov p{font-size:18px;margin:0;opacity:.95}
#ov button{background:#fff;color:#111;max-width:340px;margin-top:10px}
#toast{position:fixed;left:16px;right:16px;bottom:90px;background:#1f1e1d;color:#fff;padding:14px;border-radius:12px;font-size:14px;text-align:center;display:none;z-index:60}
button.dng{background:#c62827;color:#fff;margin-top:10px}
#wiz{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#wiz .box{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
#wiz h2{font-size:20px;margin:0 0 10px;font-family:ui-serif,Georgia,serif;font-weight:500}
#wiz .x{float:right;width:auto;background:none;color:var(--mut);padding:0 4px;font-size:26px;line-height:1}
#wiz .bar{margin-bottom:16px}
</style>
</head>
<body>
<main>
<section class="tab on" id="t-crea">
  <h1>Crea biglietto</h1>
  <p class="sub">Inserisci i dati per generare il biglietto.</p>
  <div class="card">
    <div id="nome1w"><label id="nomeLbl">Nome dell’ospite</label>
    <input id="nome" placeholder="Es. Marco Rossi" autocomplete="off"></div>
    <div class="row">
      <div style="flex:1;min-width:0"><label>Numero di telefono</label>
      <input id="tel" type="tel" inputmode="tel" placeholder="Es. 333 1234567" autocomplete="off"></div>
      <div style="width:92px"><label>N° biglietti</label>
      <input id="qta" type="number" inputmode="numeric" min="1" max="50" value="1" style="text-align:center"></div>
    </div>
    <button id="btnCrea">Crea biglietto</button>
  </div>
  <canvas id="prev"></canvas>
  <div id="azioni" style="display:none" class="row">
    <button class="wa" id="btnWa" style="flex:1;width:auto">Invia su WhatsApp</button>
    <button class="sec" id="btnSalva" style="width:40%">Salva</button>
  </div>
</section>

<section class="tab" id="t-leggi">
  <h1>Leggi biglietto</h1>
  <p class="sub">Inquadra il QR code all’ingresso.</p>
  <div class="vid"><video id="video" playsinline muted></video><div class="frame"></div></div>
  <div class="res" id="res"><b id="resT"></b><span id="resD"></span></div>
  <button id="btnCam" class="sec" style="margin-bottom:12px">Avvia fotocamera</button>
  <div class="card">
    <label>Oppure inserisci il codice a mano</label>
    <input id="manuale" class="mono" placeholder="CODICE" autocapitalize="characters" autocomplete="off">
    <button id="btnVer">Verifica</button>
  </div>
</section>

<section class="tab" id="t-conta">
  <h1>Gestione biglietti</h1>
  <p class="sub">Monitora gli utenti e gli ingressi</p>
  <div class="card">
    <div class="big"><span id="nScan">0</span><span style="font-size:22px;color:var(--mut)"> / 200</span></div>
    <div class="bar"><i id="barra"></i></div>
    <p class="sub" style="text-align:center;margin:10px 0 0">Biglietti creati: <b id="nEmessi">0</b></p>
  </div>
  <div class="filt"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="cerca" placeholder="Cerca per nome, telefono o codice" autocomplete="off"></div><button class="sec" id="btnOrd"></button></div>
  <div class="card" id="ultimi"></div>
  <button class="dng" id="btnWipe">Cancella TUTTI i dati</button>
</section>
</main>
<nav>
  <button class="on" data-t="crea"><svg viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 1 0-6V6H3z"/><path d="M14 7v10" stroke-dasharray="2 2"/></svg>Crea</button>
  <button data-t="leggi"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>Leggi</button>
  <button data-t="conta"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Conteggio</button>
</nav>

<div id="ov"><svg id="ovI" viewBox="0 0 24 24"></svg><h2 id="ovT"></h2><p id="ovD"></p><button id="btnAgain">Scannerizza di nuovo</button></div>
<div id="wiz"><div class="box">
  <button class="x" id="wzX" aria-label="Chiudi">×</button>
  <h2 id="wzT"></h2>
  <div class="bar"><i id="wzBar"></i></div>
  <label>Nome del partecipante</label>
  <input id="wzN" placeholder="Es. Marco Rossi" autocomplete="off">
  <label>Numero di telefono</label>
  <input id="wzP" type="tel" inputmode="tel" placeholder="Es. 333 1234567" autocomplete="off">
  <div class="row"><button class="sec" id="wzBack" style="width:40%">Indietro</button><button id="wzNext" style="flex:1;width:auto">Avanti</button></div>
</div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

// ---- CREA ----
function rng(){ return [1,200]; }
function nextIdx(){ const [lo,hi]=rng(); return CODES.findIndex((c,k)=>k+1>=lo&&k+1<=hi&&!S.issued[c]); }
function updNext(){}
function telNorm(t){ let d=(t||"").replace(/[^\d+]/g,""); if(d.startsWith("+")) d=d.slice(1); else if(d.startsWith("00")) d=d.slice(2); else if(d.length>=9&&d.length<=10&&d[0]==="3") d="39"+d; return d.replace(/\D/g,""); }
let cur = null;
function renderTicket(c, code, name){
  const x=c.getContext("2d"), k=2, RED="#d4130f", F="Arial,Helvetica,sans-serif";
  const tel=(S.issued[code]||{}).tel||"";
  c.width=780*k; c.height=486*k; x.setTransform(k,0,0,k,0,0);
  x.fillStyle="#151515"; x.fillRect(0,0,780,486);
  x.strokeStyle=RED; x.lineWidth=8; x.lineJoin="round"; x.strokeRect(20,20,740,446);
  x.textAlign="left"; x.textBaseline="alphabetic";
  x.fillStyle="#fff"; x.font="21px "+F; x.fillText("Il tuo biglietto d’ingresso di",87,100);
  if(LOGO.complete&&LOGO.naturalWidth){ x.drawImage(LOGO,85,116,317,42.5); } else { x.fillStyle=RED; x.font="900 66px Impact,'Arial Black',Arial,sans-serif"; x.fillText("HALLOWEEN",85,158,318); }
  x.fillStyle=RED;
  x.fillRect(63,192,654,18);
  x.fillStyle="#fff"; x.font="bold 22px "+F; x.fillText("DATI ORDINE",87,264);
  x.font="22px "+F;
  x.fillText(name||"",87,293,430); x.fillText(tel,87,319,430);
  x.fillText("Data: 31 Ottobre 2026 Ore 21.00",87,371);
  x.fillText("Via Motta Carità, 318 (80057)",87,399);
  const h=document.createElement("div");
  new QRCode(h,{text:code,width:400,height:400,correctLevel:QRCode.CorrectLevel.M});
  x.fillStyle="#fff"; x.fillRect(557,234,140,141);
  x.drawImage(h.querySelector("canvas"),565,242,124,124);
  x.textAlign="center"; x.fillText(code,627,398);
}
function groupCodes(code){
  const g=(S.issued[code]||{}).g; if(!g) return [code];
  return Object.entries(S.issued).filter(([c,v])=>v.g===g).sort((a,b)=>a[1].n-b[1].n).map(e=>e[0]);
}
function drawTicket(code, name){
  const c=$("prev"); renderTicket(c,code,name);
  c.style.display="block"; $("azioni").style.display="flex";
  const group=groupCodes(code);
  cur={code,name,tel:(S.issued[code]||{}).tel||"",group};
  $("btnSalva").textContent = group.length>1 ? "Scarica PDF" : "Salva";
}
function qty(){ return Math.max(1, Math.min(50, parseInt($("qta").value)||1)); }
function freeIdx(){ const [lo,hi]=rng(), f=[]; CODES.forEach((c,k)=>{ if(k+1>=lo && k+1<=hi && !S.issued[c]) f.push(k); }); return f; }
function emit(entries){
  const free=freeIdx(), q=entries.length;
  if(q>free.length){ alert("In questo intervallo restano solo "+free.length+" biglietti."); return; }
  const g=Date.now();
  const leader=entries[0].name;
  entries.forEach((e,j)=>{ if(j>0) e.name=e.name+" ("+leader+")"; });
  free.slice(0,q).forEach((i,j)=>{ S.issued[CODES[i]]={name:entries[j].name, tel:entries[j].tel, ts:g+j, n:i+1, g}; });
  save();
  drawTicket(CODES[free[0]],entries[0].name);
  if(q>1) toast("Creati "+q+" biglietti (n° "+(free[0]+1)+" – "+(free[q-1]+1)+")");
  $("nome").value=""; $("tel").value=""; $("qta").value=1; updBtn(); render();
  $("prev").scrollIntoView({behavior:"smooth"});
}
$("btnCrea").onclick = () => {
  const q=qty();
  const free=freeIdx();
  if(!free.length){ alert("Biglietti finiti in questo intervallo."); return; }
  if(q>free.length){ alert("In questo intervallo restano solo "+free.length+" biglietti."); return; }
  if(q>1){ openWiz(q); return; }
  const name=$("nome").value.trim();
  if(!name){ $("nome").focus(); return; }
  emit([{name, tel:$("tel").value.trim()}]);
};
function updBtn(){
  const q=qty();
  $("btnCrea").textContent = q>1 ? "Inserisci i "+q+" partecipanti" : "Crea biglietto";
  $("nomeLbl").textContent = q>1 ? "Nome del capogruppo" : "Nome dell’ospite";
}
$("qta").oninput=updBtn;

let wiz=null;
function openWiz(q){
  const t=$("tel").value.trim();
  wiz={q, i:0, data:Array.from({length:q},()=>({name:"",tel:t}))};
  wiz.data[0].name=$("nome").value.trim();
  $("wiz").style.display="flex"; wizShow();
}
function wizShow(){
  const d=wiz.data[wiz.i];
  $("wzT").textContent="Partecipante "+(wiz.i+1)+" di "+wiz.q;
  $("wzBar").style.width=((wiz.i+1)/wiz.q*100)+"%";
  $("wzN").value=d.name; $("wzP").value=d.tel;
  $("wzBack").style.visibility=wiz.i?"visible":"hidden";
  $("wzNext").textContent = wiz.i===wiz.q-1 ? "Crea biglietti" : "Avanti";
  setTimeout(()=>$("wzN").focus(),60);
}
function wizSave(){ const d=wiz.data[wiz.i]; d.name=$("wzN").value.trim(); d.tel=$("wzP").value.trim(); }
function wizNext(){
  wizSave();
  if(!wiz.data[wiz.i].name){ $("wzN").focus(); return; }
  if(wiz.i<wiz.q-1){ wiz.i++; wizShow(); return; }
  const entries=wiz.data; wiz=null; $("wiz").style.display="none"; emit(entries);
}
$("wzNext").onclick=wizNext;
$("wzBack").onclick=()=>{ wizSave(); if(wiz.i>0){ wiz.i--; wizShow(); } };
$("wzX").onclick=()=>{ if(confirm("Annullare l'inserimento dei partecipanti?")){ wiz=null; $("wiz").style.display="none"; } };
["wzN","wzP"].forEach(id=>$(id).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); if(id==="wzN") $("wzP").focus(); else wizNext(); } }));
function b64u8(d){ const b=atob(d.split(",")[1]), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function makePdf(jpegs, cw, ch, w, h){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=d=>{ const b=typeof d==="string"?enc.encode(d):d; parts.push(b); len+=b.length; };
  const obj=(n,fn)=>{ offs[n]=len; push(n+" 0 obj\n"); fn(); push("\nendobj\n"); };
  const N=jpegs.length;
  push("%PDF-1.4\n");
  obj(1,()=>push("<</Type/Catalog/Pages 2 0 R>>"));
  obj(2,()=>push("<</Type/Pages/Count "+N+"/Kids["+jpegs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"]>>"));
  jpegs.forEach((j,i)=>{
    const pg=3+3*i, cs="q "+w+" 0 0 "+h+" 0 0 cm /Im0 Do Q";
    obj(pg,()=>push("<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+w+" "+h+"]/Resources<</XObject<</Im0 "+(pg+2)+" 0 R>>>>/Contents "+(pg+1)+" 0 R>>"));
    obj(pg+1,()=>push("<</Length "+cs.length+">>\nstream\n"+cs+"\nendstream"));
    obj(pg+2,()=>{ push("<</Type/XObject/Subtype/Image/Width "+cw+"/Height "+ch+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+j.length+">>\nstream\n"); push(j); push("\nendstream"); });
  });
  const xref=len, total=3+3*N;
  push("xref\n0 "+total+"\n0000000000 65535 f \n");
  for(let n=1;n<total;n++) push(String(offs[n]).padStart(10,"0")+" 00000 n \n");
  push("trailer\n<</Size "+total+"/Root 1 0 R>>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
function pdfBlob(){
  const jp=[]; let cw=0,ch=0;
  cur.group.forEach(code=>{
    const c=document.createElement("canvas"); renderTicket(c,code,(S.issued[code]||{}).name||cur.name);
    cw=c.width; ch=c.height; jp.push(b64u8(c.toDataURL("image/jpeg",0.92)));
  });
  return makePdf(jp,cw,ch,780,486);
}
function pdfName(){ return "biglietti-"+(cur.name||"ospite").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".pdf"; }
function scarica(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function blobOf(){ return new Promise(r => $("prev").toBlob(r,"image/png")); }
function toast(t){ const e=$("toast"); e.textContent=t; e.style.display="block"; setTimeout(()=>e.style.display="none",5000); }
$("btnWa").onclick = () => {
  const url = "https://wa.me/"+telNorm(cur.tel);
  if(cur.group.length>1){
    scarica(pdfBlob(), pdfName());
    toast("PDF scaricato: nella chat WhatsApp tocca la graffetta › Documento e scegli il file");
    window.open(url,"_blank"); return;
  }
  const bp = blobOf();
  let copied = false;
  try{
    navigator.clipboard.write([new ClipboardItem({"image/png": bp})]).then(()=>toast("Biglietto copiato: nella chat tieni premuto sulla barra messaggio e incolla")).catch(()=>{});
    copied = true;
  }catch(e){}
  if(!copied){
    bp.then(async blob=>{ const f=new File([blob],"biglietto-"+cur.code+".png",{type:"image/png"});
      try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ return; }
      salva(blob); toast("Immagine salvata: allegala nella chat WhatsApp"); });
  }
  window.open(url,"_blank");
};
function salva(blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="biglietto-"+cur.code+".png"; a.click();
}
$("btnSalva").onclick = async () => {
  if(cur.group.length>1){ scarica(pdfBlob(), pdfName()); return; }
  const blob = await blobOf(), file = new File([blob], "biglietto-"+cur.code+".png", {type:"image/png"});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; } }catch(e){ if(e.name==="AbortError") return; }
  salva(blob);
};

let AC=null;
function beep(ok){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime;
  (ok?[[880,0],[1320,.12]]:[[220,0],[180,.2]]).forEach(([f,d])=>{ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.value=f; o.type=ok?"sine":"square"; g.gain.setValueAtTime(.3,t+d); g.gain.exponentialRampToValueAtTime(.001,t+d+(ok?.2:.35)); o.connect(g); g.connect(AC.destination); o.start(t+d); o.stop(t+d+.4); }); }catch(e){} }
function showRes(ok,title,desc){
  const o=$("ov"); o.className=ok?"ok":"bad"; o.style.display="flex";
  $("ovI").innerHTML = ok ? '<path d="M4 12.5l5 5L20 6.5"/>' : '<path d="M5 5l14 14M19 5L5 19"/>';
  $("ovT").textContent=title; $("ovD").textContent=desc;
  beep(ok); if(ok) nav(120); else nav(300,100,300);
}
function check(raw){
  const code = (raw||"").trim().toUpperCase();
  pause=true;
  if(!CODES.includes(code)) showRes(false,"Non valido","Questo codice non esiste.");
  else if(S.scanned[code]) showRes(false,"Già utilizzato","Entrato alle "+fmt(S.scanned[code])+(S.issued[code]?" · "+S.issued[code].name:""));
  else { S.scanned[code]=Date.now(); save(); showRes(true,"Valido",(S.issued[code]?S.issued[code].name+" · ":"")+code); }
  render();
}
$("btnAgain").onclick=()=>{ $("ov").style.display="none"; pause=false; if(!stream) startCam(); };
$("btnWipe").onclick=()=>{ if(confirm("Cancellare TUTTI i dati (biglietti creati, ingressi, impostazioni)? L'operazione non si può annullare.")){ try{localStorage.clear();}catch(e){} location.reload(); } };
function nav(...p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
let stream=null, loop=null, pause=false;
async function startCam(){
  if(stream) return;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const tr=stream.getVideoTracks()[0];
    try{ const cap=tr.getCapabilities&&tr.getCapabilities();
      if(cap&&cap.zoom){ const z=Math.min(cap.zoom.max,Math.max(cap.zoom.min,2)); await tr.applyConstraints({advanced:[{zoom:z}]}); }
      if(cap&&cap.focusMode&&cap.focusMode.includes("continuous")) await tr.applyConstraints({advanced:[{focusMode:"continuous"}]});
    }catch(e){}
    const v=$("video"); v.srcObject=stream; await v.play();
    $("btnCam").textContent="Ferma fotocamera";
    let bd=null; try{ if("BarcodeDetector" in window) bd=new BarcodeDetector({formats:["qr_code"]}); }catch(e){}
    const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
    let busy=false;
    loop=setInterval(async()=>{
      if(pause||busy||!v.videoWidth) return; busy=true;
      try{
        let data=null;
        if(bd){ const r=await bd.detect(v); if(r.length) data=r[0].rawValue; }
        if(!data){
          const side=Math.min(v.videoWidth,v.videoHeight)*0.7, sx=(v.videoWidth-side)/2, sy=(v.videoHeight-side)/2, out=Math.min(800,Math.floor(side));
          cv.width=out; cv.height=out; cx.drawImage(v,sx,sy,side,side,0,0,out,out);
          const d=cx.getImageData(0,0,out,out), q=jsQR(d.data,out,out,{inversionAttempts:"attemptBoth"});
          if(q&&q.data) data=q.data;
        }
        if(data) check(data);
      }catch(e){}
      busy=false;
    },150);
  }catch(e){ stream=null; alert("Fotocamera non disponibile: usa l’inserimento manuale del codice."); }
}
function stopCam(){
  clearInterval(loop); if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null;
  $("btnCam").textContent="Avvia fotocamera"; loop=null;
}
$("btnCam").onclick = () => stream ? stopCam() : startCam();
$("btnVer").onclick = () => { check($("manuale").value); $("manuale").value=""; };

// ---- CONTEGGIO ----
let entratiSu=true;
function counts(){
  const n=Object.keys(S.scanned).length;
  $("nScan").textContent=n; $("barra").style.width=(n/200*100)+"%";
  $("nEmessi").textContent=Object.keys(S.issued).length;
}
function match(c,v,q){ return !q || (v.name+" "+c+" "+(v.tel||"")).toLowerCase().includes(q); }
function render(){
  counts();
  $("btnOrd").innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;transition:transform .2s;transform:rotate('+(entratiSu?180:0)+'deg)"><path d="M4 7h16M7 12h10M9.5 17h5"/></svg>';$("btnOrd").title=entratiSu?"Entrati in alto":"Entrati in basso";
  const q=($("cerca").value||"").trim().toLowerCase();
  const rows = Object.entries(S.issued).filter(([c,v])=>match(c,v,q)).sort((a,b)=>{
    const ia=S.scanned[a[0]]?1:0, ib=S.scanned[b[0]]?1:0;
    if(ia!==ib) return entratiSu ? ib-ia : ia-ib;
    return a[1].n-b[1].n;
  });
  $("ultimi").innerHTML = rows.length ? rows.map(([c,v])=>{ const t=S.scanned[c];
    return `<div class="sw" data-c="${c}">${t?'<div class="bk">Annulla ingresso</div>':''}<div class="li${t?' in':''}"><span>${esc(v.name)}<br><small class="mono">${c}${v.tel?" · "+esc(v.tel):""}</small></span><small>${t?"Entrato "+fmt(t):"Non entrato"}</small></div></div>`; }).join("") : '<p class="sub" style="margin:0">'+(q?"Nessun risultato.":"Nessun biglietto creato.")+'</p>';
}
// Swipe a sinistra per annullare l'ingresso (la lista non si riordina da sola)
(function(){
  let el=null, x0=0, dx=0, y0=0, moved=false;
  const L=$("ultimi");
  L.addEventListener("pointerdown",e=>{ const li=e.target.closest(".li.in"); if(!li) return; el=li; x0=e.clientX; y0=e.clientY; dx=0; moved=false; li.classList.add("drag"); });
  L.addEventListener("pointermove",e=>{ if(!el) return; dx=Math.min(0,e.clientX-x0); if(Math.abs(e.clientY-y0)>Math.abs(e.clientX-x0)&&!moved){ end(false); return; } if(dx<-6){ moved=true; try{ el.setPointerCapture(e.pointerId); }catch(_){} } el.style.transform="translateX("+dx+"px)"; });
  function end(commit){
    if(!el) return; const li=el; el=null; li.classList.remove("drag");
    if(commit && dx<-90){
      const c=li.parentNode.dataset.c; delete S.scanned[c]; save(); counts();
      li.style.transform=""; li.classList.remove("in"); li.querySelector("small").textContent="Ingresso annullato";
      const bk=li.parentNode.querySelector(".bk"); if(bk) bk.remove();
      try{ navigator.vibrate&&navigator.vibrate(40); }catch(_){}
    } else li.style.transform="";
  }
  L.addEventListener("pointerup",()=>end(true));
  L.addEventListener("pointercancel",()=>end(false));
})();
$("btnOrd").onclick=()=>{ entratiSu=!entratiSu; render(); };
function rivedi(c){ drawTicket(c,S.issued[c].name); $("prev").scrollIntoView({behavior:"smooth"}); }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function cleanTel(el){ let v=el.value.replace(/[^\d+]/g,""); if(v.startsWith("+39")) v=v.slice(3); else if(!/^\+3?$/.test(v)) v=v.replace(/\+/g,""); if(v!==el.value) el.value=v; }
["tel","wzP"].forEach(id=>$(id).addEventListener("input",()=>cleanTel($(id))));
$("cerca").oninput=render;
render();
</script>
